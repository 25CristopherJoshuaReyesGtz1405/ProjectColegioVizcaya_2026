<!-- 1. CAPA DE TOASTS (Notificaciones Flotantes) -->
<!-- Se muestran arriba a la derecha -->
<div class="contenedor-toasts">
  @for (toast of lista(); track toast.id) {
    <div 
      class="toast-card" 
      [ngClass]="[toast.tipo, toast.cerrando ? 'salida' : 'entrada']"
      (click)="servicio.cerrar(toast.id)">
      
      <div class="icono">
        <img
          src="https://images.seeklogo.com/logo-png/30/2/colegio-vizcaya-logo-png_seeklogo-307798.png"
          alt="Logo Colegio Vizcaya"
          class="logo-colegio"
        />
      </div>

      <div class="contenido">
        <div class="titulo">{{ toast.titulo }}</div>
        <div class="mensaje">{{ toast.mensaje }}</div>
      </div>

      <div class="icono">
        <i class="bi" 
           [class.bi-check-circle-fill]="toast.tipo === 'exito'"
           [class.bi-x-octagon-fill]="toast.tipo === 'error'"
           [class.bi-info-circle-fill]="toast.tipo === 'info'">
        </i>
      </div>

      <button class="btn-cerrar">&times;</button>
    </div>
  }
</div>

<!-- 2. CAPA DE MODAL DE CONFIRMACIÓN (Ventana Emergente) -->
<!-- Solo se muestra si 'modalState$' tiene datos (no es null) -->
@if (modalState$ | async; as modal) {
  
  <!-- Fondo oscuro que cubre toda la pantalla -->
  <div class="modal-backdrop" (click)="onCancel()">
    
    <!-- La tarjeta del modal (Detenemos el click para no cerrar al tocar la tarjeta) -->
    <div class="modal-content" (click)="$event.stopPropagation()">
      
      <!-- Cuerpo: Icono y Texto -->
      <div class="modal-body">
        <div class="icon-wrapper warning">
          <i class="bi bi-question-lg"></i>
        </div>
        
        <div class="texto-wrapper">
          <h2 class="titulo">{{ modal.titulo }}</h2>
          <p class="mensaje">{{ modal.mensaje }}</p>
        </div>
      </div>

      <!-- Footer: Botones -->
      <div class="modal-footer">
        <!-- Botón Secundario (Cancelar) -->
        <button class="btn btn-secundario" (click)="onCancel()">
          Cancelar
        </button>

        <!-- Botón Principal (Confirmar) -->
        <!-- El texto viene del servicio (ej. 'Sí, eliminar') -->
        <button class="btn btn-primary" (click)="onConfirm(modal)">
          {{ modal.textoBotonConfirmar }}
        </button>
      </div>
      
    </div>
  </div>
}
