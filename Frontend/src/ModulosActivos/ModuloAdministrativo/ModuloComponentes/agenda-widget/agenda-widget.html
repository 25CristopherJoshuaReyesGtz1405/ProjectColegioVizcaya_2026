<div class="widget-container custom-scrollbar">
    
    <div *ngIf="actividades.length === 0" class="empty-state">
        <i class="bi bi-calendar-range"></i>
        <p>Agenda libre por hoy</p>
    </div>

    <div class="cards-list">
        <div *ngFor="let act of actividades" class="activity-card group">
            
            <div class="status-indicator" [ngClass]="act.estatus === 'COMPLETADA' ? 'bg-green' : 'bg-guinda'"></div>
            
            <div class="card-content">
                <div class="card-top">
                    <h4 class="title" [ngClass]="{'line-through text-gray-400': act.estatus === 'COMPLETADA'}">
                        {{ act.titulo }}
                    </h4>
                    <div class="time-badge">{{ act.fecha | date:'HH:mm' }}</div>
                </div>

                <div class="card-middle">
                    <p class="desc">{{ act.descripcion }}</p>
                </div>

                <div class="card-bottom">
                    <span class="date-text">
                        <i class="bi bi-calendar4-week"></i> {{ act.fecha | date:'d MMM' }}
                    </span>
                    <div class="icon-wrapper">
                        <i [class]="'bi ' + getIcono(act.titulo)"></i>
                    </div>
                </div>
            </div>

            <div class="completion-overlay" *ngIf="act.estatus !== 'COMPLETADA'" (click)="confirmarCompletado(act)">
                <button class="btn-check-circle">
                    <i class="bi bi-check-lg"></i>
                </button>
                <span class="hover-text">Marcar como hecho</span>
            </div>

        </div>
    </div>
</div>
