<div class="modal-backdrop fade-in" (click)="cerrarModal()">
  <div class="premium-modal form-modal animate-slide-up" (click)="$event.stopPropagation()">
    
    <header class="modal-header guinda-gradient">
      <div class="header-content">
        <span class="badge-tag"><i class="bi bi-person-plus-fill me-1"></i> Control Escolar</span>
        <div class="header-titles">
          <h2>Registrar Nuevo Estudiante</h2>
          <p>Complete los datos para generar el expediente académico y credenciales</p>
        </div>
      </div>
      <button class="btn-close-white" (click)="cerrarModal()" [disabled]="guardando"><i class="bi bi-x-lg"></i></button>
    </header>

    <div class="modal-body custom-scroll">
      <form class="premium-form grid-layout" (ngSubmit)="guardar()" #estudianteForm="ngForm">
        
        <div class="form-section">
          <h3 class="section-title"><i class="bi bi-person-vcard"></i> Datos Personales</h3>
          
          <div class="avatar-upload-container">
            <input type="file" id="fotoPerfil" (change)="onFotoSelected($event)" accept="image/*" hidden>
            <label for="fotoPerfil" class="avatar-preview-circle" [class.has-image]="fotoPreview">
              <img *ngIf="fotoPreview" [src]="fotoPreview" alt="Foto">
              <div class="upload-placeholder" *ngIf="!fotoPreview">
                <i class="bi bi-camera"></i>
                <span>Foto</span>
              </div>
            </label>
          </div>

          <div class="inputs-container">
            <div class="input-group">
              <label>Nombre(s) <span class="req">*</span></label>
              <div class="input-wrapper">
                <i class="bi bi-person icon"></i>
                <input type="text" [(ngModel)]="nuevoEstudiante.nombre" name="nombre" placeholder="Ej. Juan Carlos" required>
              </div>
            </div>

            <div class="input-group">
              <label>Apellidos <span class="req">*</span></label>
              <div class="input-wrapper">
                <i class="bi bi-person-lines-fill icon"></i>
                <input type="text" [(ngModel)]="nuevoEstudiante.apellidos" name="apellidos" placeholder="Ej. Pérez Gómez" required>
              </div>
            </div>

            <div class="row-group">
              <div class="input-group flex-1">
                <label>CURP</label>
                <div class="input-wrapper">
                  <i class="bi bi-upc-scan icon"></i>
                  <input type="text" [(ngModel)]="nuevoEstudiante.curp" name="curp" placeholder="18 caracteres" maxlength="18">
                </div>
              </div>

              <div class="input-group flex-1">
                <label>Nacimiento</label>
                <div class="input-wrapper">
                  <i class="bi bi-calendar-date icon"></i>
                  <input type="date" [(ngModel)]="nuevoEstudiante.fechaNacimiento" name="fechaNacimiento">
                </div>
              </div>
            </div>

            <div class="input-group mt-1">
              <label>Sexo</label>
              <div class="radio-pills">
                <label class="pill">
                  <input type="radio" name="sexo" value="HOMBRE" [(ngModel)]="nuevoEstudiante.sexo">
                  <span>Hombre</span>
                </label>
                <label class="pill">
                  <input type="radio" name="sexo" value="MUJER" [(ngModel)]="nuevoEstudiante.sexo">
                  <span>Mujer</span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <div class="form-section bg-gray-section">
          
          <h3 class="section-title"><i class="bi bi-shield-lock"></i> Credenciales de Acceso</h3>
          <div class="inputs-container mb-4">
            <div class="input-group">
              <label>Correo Electrónico Institucional <span class="req">*</span></label>
              <div class="input-wrapper">
                <i class="bi bi-envelope-at icon"></i>
                <input type="email" [(ngModel)]="nuevoEstudiante.email" name="email" placeholder="alumno@colegiovizcaya.edu.mx" required>
              </div>
            </div>

            <div class="input-group">
              <label>Contraseña Temporal <span class="req">*</span></label>
              <div class="input-wrapper">
                <i class="bi bi-key icon"></i>
                <input type="password" [(ngModel)]="nuevoEstudiante.password" name="password" placeholder="Mínimo 6 caracteres" required>
              </div>
            </div>
          </div>

          <h3 class="section-title"><i class="bi bi-mortarboard"></i> Datos Académicos</h3>
          <div class="inputs-container">
            <div class="input-group">
              <label>Matrícula / Folio <span class="req">*</span></label>
              <div class="input-wrapper">
                <i class="bi bi-hash icon"></i>
                <input type="text" [(ngModel)]="nuevoEstudiante.matricula" name="matricula" placeholder="Asignación manual" required>
              </div>
            </div>

            <div class="row-group">
              <div class="input-group flex-1">
                <label>Grado</label>
                <div class="select-wrapper">
                  <i class="bi bi-bar-chart-steps icon"></i>
                  <select [(ngModel)]="nuevoEstudiante.grado" name="grado">
                    <option [value]="1">1° Semestre</option>
                    <option [value]="2">2° Semestre</option>
                    <option [value]="3">3° Semestre</option>
                    <option [value]="4">4° Semestre</option>
                    <option [value]="5">5° Semestre</option>
                    <option [value]="6">6° Semestre</option>
                  </select>
                </div>
              </div>

              <div class="input-group flex-1">
                <label>Grupo</label>
                <div class="select-wrapper">
                  <select [(ngModel)]="nuevoEstudiante.grupo" name="grupo" class="ps-3">
                    <option value="A">Grupo A</option>
                    <option value="B">Grupo B</option>
                    <option value="C">Grupo C</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

        </div>
      </form>
    </div>

    <div class="modal-footer justify-end">
      <button type="button" class="btn-ghost" (click)="cerrarModal()" [disabled]="guardando">Cancelar</button>
      <button type="button" class="btn-guinda shadow-btn" (click)="guardar()" [disabled]="!estudianteForm.valid || guardando">
        <i class="bi" [ngClass]="guardando ? 'bi-hourglass-split spin-icon' : 'bi-check-circle'"></i> 
        {{ guardando ? 'Registrando...' : 'Guardar Estudiante' }}
      </button>
    </div>

  </div>
</div>
