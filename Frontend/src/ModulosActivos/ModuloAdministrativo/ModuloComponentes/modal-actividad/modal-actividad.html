
<div class="modal-backdrop" *ngIf="visible" (click)="cancelar()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    
    <header class="modal-header">
      <div class="header-branding">
        <img src="https://images.seeklogo.com/logo-png/30/2/colegio-vizcaya-logo-png_seeklogo-307798.png" alt="Logo Colegio Vizcaya" class="logo-colegio" />
      </div>
      <div class="header-title">
        <h2>Nueva Actividad</h2>
        <p>Programa un evento en la agenda institucional.</p>
      </div>
      <button class="btn-close" (click)="cancelar()"><i class="bi bi-x-lg"></i></button>
    </header>

    <form class="modal-body" #actividadForm="ngForm">
      
      <div class="form-row">
        <div class="form-group full-width">
          <label for="titulo">Título del Evento</label>
          <input type="text" id="titulo" name="titulo" 
                 [(ngModel)]="formData.titulo" required 
                 placeholder="Ej: Junta de Consejo Técnico">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha" 
                 [(ngModel)]="tempFecha" required>
        </div>
        <div class="form-group">
          <label for="hora">Hora</label>
          <input type="time" id="hora" name="hora" 
                 [(ngModel)]="tempHora" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="tipo">Tipo de Actividad</label>
          <select id="tipo" name="tipo" [(ngModel)]="formData.tipo" required>
            <option value="reunion">Reunión 👥</option>
            <option value="mitin">Mitin / Discurso 📢</option>
            <option value="recorrido">Recorrido 🚶‍♂️</option>
            <option value="medios">Entrevista / Medios 🎤</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group full-width">
          <label for="descripcion">Descripción / Ubicación</label>
          <textarea class="color_text" id="descripcion" name="descripcion" rows="3" 
                    [(ngModel)]="formData.descripcion" 
                    placeholder="Detalles adicionales o lugar del evento..."></textarea>
        </div>
      </div>

    </form>

    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
      <button class="btn btn-primary" [disabled]="!actividadForm.valid || !tempFecha || !tempHora" (click)="guardar()">
        Agendar Actividad
      </button>
    </div>

  </div>
</div>
